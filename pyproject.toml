[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eclipse-aperture"
version = "0.1.0"
description = "Eclipse Aperture MCP — the Instagram adapter of the Eclipse social family, formalized: a static capability declaration, hash-bound native Feed/Carousel/Story/Reel variants with classified diffs, and the preview pack the owner approves. Posts nothing and holds no credential material; publishing stays on the house's existing sanctioned Graph API route."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cyan Eclipse Technologies LLC" },
]
keywords = ["mcp", "model-context-protocol", "instagram", "social-media", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://cetech.ai"
Repository = "https://github.com/CYAN-ECLIPSE-TECHNOLOGIES-LLC/eclipse-aperture-mcp"
Vendor = "https://cetech.ai"

[project.scripts]
eclipse-aperture = "server:main"

# Version lockstep: this version, the VERSION file, server.json, and the
# server.py docstring all read 0.1.0 — bump them together.
# Flat layout: the runtime is the top-level server.py module. Runtime
# data read beside server.py (Path(__file__).parent / ...) is
# force-included at the same relative path in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"fixtures/capability.json" = "fixtures/capability.json"

[tool.hatch.build.targets.sdist.force-include]
"server.py" = "server.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"fixtures/capability.json" = "fixtures/capability.json"
